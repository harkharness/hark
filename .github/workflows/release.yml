name: release

# Tag `v*` builds the desktop app (.dmg + .app.tar.gz) and the `hark` CLI
# for both macOS architectures and publishes everything to a Release on the
# PUBLIC releases-only repo (harkharness/hark) — binaries ship, source never
# does. Asset names are version-less so /releases/latest/download URLs stay
# stable. Needs the RELEASE_TOKEN secret (a PAT with write access to
# harkharness/hark). No code signing yet: install.sh clears quarantine.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Both targets build on Apple Silicon: the macos-13 (Intel) runner
        # was retired by GitHub and its label queues forever. clang targets
        # x86_64 natively, so the Intel build is a cross-compile.
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-14
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: The tag must match the app version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CONF=$(sed -n 's/.*"version": "\(.*\)",.*/\1/p' src-tauri/tauri.conf.json | head -1)
          CRATE=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag=${TAG} tauri.conf=${CONF} Cargo=${CRATE}"
          [ "${TAG}" = "${CONF}" ] && [ "${TAG}" = "${CRATE}" ] || {
            echo "::error::tag ${TAG} disagrees with the app version — bump src-tauri/tauri.conf.json and Cargo.toml before tagging (v0.2.1 shipped an app reporting 0.2.0)."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Build app bundles (.app + .dmg)
        run: npx tauri build --target ${{ matrix.target }}

      - name: Build hark CLI
        run: cargo build --release --target ${{ matrix.target }} -p hark-cli

      - name: Package assets
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          TARGET="${{ matrix.target }}"
          BUNDLE="target/${TARGET}/release/bundle"
          mkdir -p out

          # Version-less names: the release tag carries the version, and
          # /releases/latest/download/<name> keeps working forever.
          cp "${BUNDLE}"/dmg/*.dmg "out/hark-app-${TARGET}.dmg"
          tar -czf "out/hark-app-${TARGET}.app.tar.gz" \
            -C "${BUNDLE}/macos" hark.app
          tar -czf "out/hark-cli-${TARGET}.tar.gz" \
            -C "target/${TARGET}/release" hark
          echo "built ${VERSION} for ${TARGET}"

          (cd out && shasum -a 256 * > "checksums-${TARGET}.txt")

      - name: Publish to the public releases repo
        uses: softprops/action-gh-release@v2
        with:
          repository: harkharness/hark
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: out/*
          body: >
            Hark ${{ github.ref_name }} — free beta. Install:
            `curl -fsSL https://harkharness.web.app/install.sh | bash`
