name: release

# Tag `v*` builds the desktop app (.dmg + .app.tar.gz) and the `hark` CLI
# for both macOS architectures and publishes everything to a Release on the
# PUBLIC releases-only repo (harkharness/hark) — binaries ship, source never
# does. Asset names are version-less so /releases/latest/download URLs stay
# stable. Needs the RELEASE_TOKEN secret (a PAT with write access to
# harkharness/hark). No code signing yet: install.sh clears quarantine.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Both targets build on Apple Silicon: the macos-13 (Intel) runner
        # was retired by GitHub and its label queues forever. clang targets
        # x86_64 natively, so the Intel build is a cross-compile.
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-14
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: The tag must match the app version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CONF=$(sed -n 's/.*"version": "\(.*\)",.*/\1/p' src-tauri/tauri.conf.json | head -1)
          CRATE=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag=${TAG} tauri.conf=${CONF} Cargo=${CRATE}"
          [ "${TAG}" = "${CONF}" ] && [ "${TAG}" = "${CRATE}" ] || {
            echo "::error::tag ${TAG} disagrees with the app version — bump src-tauri/tauri.conf.json and Cargo.toml before tagging (v0.2.1 shipped an app reporting 0.2.0)."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Build app bundles (.app + .dmg)
        env:
          # Signs the updater artifact (minisign). The pubkey lives in
          # tauri.conf.json; installed apps refuse an update whose
          # signature this key did not produce.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build --target ${{ matrix.target }}

      - name: Build hark CLI
        run: cargo build --release --target ${{ matrix.target }} -p hark-cli

      - name: Package assets
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          TARGET="${{ matrix.target }}"
          BUNDLE="target/${TARGET}/release/bundle"
          mkdir -p out

          # Version-less names: the release tag carries the version, and
          # /releases/latest/download/<name> keeps working forever.
          cp "${BUNDLE}"/dmg/*.dmg "out/hark-app-${TARGET}.dmg"
          # The updater's tar.gz, NOT a re-tar: the .sig covers these
          # exact bytes. Same layout (hark.app at the root), so install.sh
          # keeps working unchanged.
          cp "${BUNDLE}/macos/hark.app.tar.gz" "out/hark-app-${TARGET}.app.tar.gz"
          cp "${BUNDLE}/macos/hark.app.tar.gz.sig" "out/hark-app-${TARGET}.app.tar.gz.sig"
          tar -czf "out/hark-cli-${TARGET}.tar.gz" \
            -C "target/${TARGET}/release" hark
          echo "built ${VERSION} for ${TARGET}"

          (cd out && shasum -a 256 * > "checksums-${TARGET}.txt")

      - name: Publish to the public releases repo
        uses: softprops/action-gh-release@v2
        with:
          repository: harkharness/hark
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: out/*
          body: >
            Hark ${{ github.ref_name }} — free beta. Install:
            `curl -fsSL https://harkharness.web.app/install.sh | bash`

  # latest.json is what installed apps poll. Built AFTER both targets so
  # it can never point at an asset that does not exist yet.
  manifest:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      REPO: harkharness/hark
    steps:
      - name: Compose and upload latest.json
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          mkdir sigs && cd sigs
          gh release download "${TAG}" --repo "${REPO}" --pattern '*.sig'
          url() { echo "https://github.com/${REPO}/releases/download/${TAG}/hark-app-$1.app.tar.gz"; }
          jq -n \
            --arg version "${VERSION}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sig_arm "$(cat hark-app-aarch64-apple-darwin.app.tar.gz.sig)" \
            --arg sig_x64 "$(cat hark-app-x86_64-apple-darwin.app.tar.gz.sig)" \
            --arg url_arm "$(url aarch64-apple-darwin)" \
            --arg url_x64 "$(url x86_64-apple-darwin)" \
            '{version: $version, pub_date: $pub_date, platforms: {
               "darwin-aarch64": {signature: $sig_arm, url: $url_arm},
               "darwin-x86_64":  {signature: $sig_x64, url: $url_x64}}}' \
            > latest.json
          jq . latest.json
          gh release upload "${TAG}" latest.json --clobber --repo "${REPO}"
