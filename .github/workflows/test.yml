name: test

# Keeps releases honest: workspace tests, clippy as errors, typecheck and
# the frontend build. macOS runner because whisper-rs builds with metal.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Secret scanning is a paid feature for private repos, so the control
  # lives here instead: the whole history, every push, pinned binary.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks over the full history
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 -c .gitleaks.toml

  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # PINNED, not @stable: a floating toolchain turned every new rust
      # release with new clippy lints into a red push (1.98 broke 6 in a
      # row, 09/2026). Bump this deliberately, fixing new lints in the
      # same commit.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: clippy

      - uses: swatinem/rust-cache@v2

      - run: npm ci
      - run: npx tsc --noEmit
      # The composer's fence parser has broken three times in a row by
      # hand-testing alone; it has unit tests now and they gate the push.
      - run: npm test
      - run: npm run build
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
