name: test

# Keeps releases honest: workspace tests, clippy as errors, typecheck and
# the frontend build.
#
# Split across two runners on purpose. When this ran from a private repo,
# a macOS minute cost TEN Linux minutes against the included quota, and
# in September 2026 the pushes (79 runs) ate the month before the
# releases (7 runs) got a chance. Public repos run free, but the split
# stays: everything that does not need a Mac runs on Linux, which starts
# faster, and the Mac job gets the built `dist` as an artifact instead of
# running npm itself. What still needs the Mac: whisper-rs with metal,
# and tauri-build.

on:
  push:
    branches: [main]
    # Prose and mockups cannot break the build, and a skipped run is the
    # cheapest run there is.
    # (docs/site is not ignored: its translations are gated below.)
    paths-ignore:
      - "docs/*.md"
      - "docs/img/**"
      - "*.md"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "docs/*.md"
      - "docs/img/**"
      - "*.md"
      - ".gitignore"

# Two pushes a minute apart used to mean two full runs, and the first one
# was already worthless.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GitHub scans this public repo for secrets too; this job stays because
  # it reads the whole history with our allowlist on every push and PR,
  # and fails the run: pinned binary, no license needed.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks over the full history
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 -c .gitleaks.toml

  # The docs site speaks three languages or none: every English page under
  # docs/site needs its pt-br and es twins, stamped with the hash of the
  # English they were translated from and keeping its skeleton. Pure
  # node, seconds; the same script runs in the release gate.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/docs-check.mjs

  # The whole frontend, on the cheap runner. Its `dist` is what the Mac
  # job needs from it: tauri-build only checks that frontendDist exists.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # The composer's fence parser has broken three times in a row by
      # hand-testing alone; it has unit tests now and they gate the push.
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

  # The same tests and lints on Linux: the app ships there too (phase 15),
  # and a `say`, an `open -R` or a macOS-only builder call must fail here
  # before it fails on someone's desktop. The webkit/gtk packages are what
  # tauri-build links against; alsa is cpal's; speech-dispatcher is the
  # voice. whisper.cpp builds for the CPU here.
  rust-linux:
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Tauri's Linux toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev \
            libssl-dev pkg-config cmake clang libasound2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: clippy
      - uses: swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust:
    needs: web
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # No npm on this runner: the bundle it would build is already built.
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # PINNED, not @stable: a floating toolchain turned every new rust
      # release with new clippy lints into a red push (1.98 broke 6 in a
      # row, 09/2026). Bump this deliberately, fixing new lints in the
      # same commit.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: clippy

      - uses: swatinem/rust-cache@v2

      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
