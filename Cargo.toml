[workspace]
resolver = "2"
members = [
    "crates/hark-agent",
    "crates/hark-core",
    "crates/hark-plugin-claude",
    "crates/hark-plugin-acp",
    "crates/hark-cli",
    "src-tauri",
]
exclude = ["spikes/whisper-spike"]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jhonmike/hark-harness"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
