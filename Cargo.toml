[workspace]
resolver = "2"
members = ["crates/vox-core", "crates/vox-cli", "src-tauri"]
exclude = ["spikes/whisper-spike"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jhonmike/vox"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
