[package]
name = "hark-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "hark_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hark-core = { path = "../crates/hark-core" }
hark-agent = { path = "../crates/hark-agent" }
hark-plugin-claude = { path = "../crates/hark-plugin-claude" }
hark-plugin-acp = { path = "../crates/hark-plugin-acp" }
tauri = { version = "2", features = ["macos-private-api", "unstable"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
urlencoding = "2"
dirs = "7"
tauri-plugin-global-shortcut = "2.3.2"
# Real PTY for the in-app terminal (the user's own shell, interactive).
portable-pty = "0.9"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-deep-link = "2"

# The browser panel's page is a child webview; on Linux its place in the
# window is a GTK overlay Hark builds itself (lib.rs, gtk_place). Same
# versions as tauri's, so the widgets are the same types.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"
