[package]
name = "hark-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hark-agent = { path = "../hark-agent" }
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
toml = "1.1"
cpal = "0.18"
toml_edit = "0.25"
sha2 = "0.11"

# Metal only where it is a win: Apple Silicon. On Intel Macs whisper.cpp's
# Metal path runs on an iGPU/AMD card, where it is slower and less stable
# than the CPU build — and a slow model load is what made the microphone
# look broken there.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(not(all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
whisper-rs = { version = "0.14" }

[dev-dependencies]
tempfile = "3"
